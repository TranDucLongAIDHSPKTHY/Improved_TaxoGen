# DBLP titles from the TaxoGen release (taxonomy construction only, no recommendation).
# Get the data with: python -m taxorec download --config configs/dblp.yaml
# (Google Drive file linked from github.com/franticnerd/taxogen, sha256-checked; see data.TAXOGEN_DBLP)
# The release's global embeddings were trained on every title, test titles
# included, so they are not used: word2vec is trained on the documents a
# method is built from, as for the other datasets.
_base_: _base_taxonomy.yaml
dataset: dblp
paths:
  out_dir: outputs/dblp
corpus:
  source: dblp
  papers: data/dblp_raw/input/papers.txt
  keywords: data/dblp_raw/input/keywords.txt
